<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPulse Editor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/documents">
            🚀 DevPulse
        </a>

    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-4">Markdown Editor</h2>

    {% if document %}
    <form method="POST" action="/edit/{{ document['_id'] }}">
    {% else %}
    <form method="POST" action="/new">
    {% endif %}

    <div class="mb-3">

        <label class="form-label">Title</label>

        <input
            type="text"
            class="form-control"
            name="title"
            value="{{ document['title'] if document else '' }}"
            required>

    </div>

    <div class="row">

        <!-- Markdown Editor -->
        <div class="col-md-6">

            <label class="form-label">
                Markdown
            </label>

            <textarea
                id="editor"
                class="form-control"
                name="content"
                rows="18"
            >{{ document['content'] if document else '' }}</textarea>

        </div>

        <!-- Live Preview -->
        <div class="col-md-6">

            <label class="form-label">
                Live Preview
            </label>

            <div
                id="preview"
                class="border rounded bg-white p-3"
                style="min-height:420px;">
            </div>

        </div>

    </div>

    <br>

    <button type="submit" class="btn btn-success">
        💾 Save Document
    </button>

    <a href="/documents" class="btn btn-secondary">
        ⬅ Back
    </a>

    </form>

</div>

<script>

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");

function updatePreview() {
    preview.innerHTML = marked.parse(editor.value);
}

editor.addEventListener("input", updatePreview);

updatePreview();

</script>

</body>
</html>
