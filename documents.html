<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>My Documents</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/dashboard">
🚀 DevPulse
</a>

<div>

<a href="/dashboard" class="btn btn-secondary">
← Back
</a>

<a href="/new" class="btn btn-success">
➕ New Document
</a>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

</div>

</nav>

<div class="container mt-4">

<h2>📄 My Documents</h2>

<input
class="form-control mb-3"
id="search"
type="text"
placeholder="Search Documents..."
onkeyup="searchTable()"
>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>Title</th>

<th>Created</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="tableBody">

{% for doc in documents %}

<tr>

<td>{{ doc.title }}</td>

<td>

{% if doc.created_at %}
{{ doc.created_at.strftime("%d-%m-%Y") }}
{% endif %}

</td>

<td>

<a href="/view/{{ doc._id }}" class="btn btn-info btn-sm">
View
</a>

<a href="/edit/{{ doc._id }}" class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete/{{ doc._id }}" class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<script>

function searchTable(){

let input=document.getElementById("search").value.toLowerCase();

let rows=document.querySelectorAll("#tableBody tr");

rows.forEach(function(row){

let title=row.cells[0].innerText.toLowerCase();

row.style.display=title.includes(input)?"":"none";

});

}

</script>

</body>

</html>
